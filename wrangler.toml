name = "shuttle"
main = "src/worker.js"
compatibility_date = "2026-09-01"
workers_dev = true

[assets]
directory = "public"
binding = "ASSETS"
not_found_handling = "none"
run_worker_first = ["/api/*", "/v/*", "/raw/*", "/thumb/*"]

[[r2_buckets]]
binding = "VIDEOS"
bucket_name = "shuttle-videos"

[[d1_databases]]
binding = "DB"
database_name = "shuttle"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[observability]
enabled = true
