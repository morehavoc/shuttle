# Deploys Shuttle to Cloudflare (Worker + R2 bucket + D1 database). This is the only deploy path;
# nobody runs `wrangler deploy` by hand. It doesn't run the tests: pr-check.yml runs them on every
# pull request, before it's merged, and every change reaches main through one.
#
# Repo secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   account token with: Workers Scripts Edit, Workers R2 Storage Edit, D1 Edit
#                          (if the deploy fails on the AI binding, add Workers AI Read)
#   CLOUDFLARE_ACCOUNT_ID
#   OWNER_PASSWORD         the password you sign in with
#   SHUTTLE_DOMAIN         optional: a hostname like videos.example.com, served as a Workers Custom
#                          Domain (Cloudflare creates the DNS record and certificate). The zone must be
#                          on this account and the hostname must not already have a CNAME. The token
#                          also needs zone access for that zone: Workers Routes Edit, DNS Edit, Zone Read.
#                          Unset = workers.dev only. Removing it later does not detach the domain; do
#                          that in the dashboard (Workers -> shuttle -> Domains & Routes).
# SESSION_SECRET is generated on the first deploy and never leaves Cloudflare.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-shuttle
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    # Only main deploys. "Run workflow" offers any branch, and without this a branch nobody
    # reviewed could go live (and run with the Cloudflare secrets).
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Secrets present
        id: check
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          P: ${{ secrets.OWNER_PASSWORD }}
        run: |
          if [ -z "$T" ] || [ -z "$A" ] || [ -z "$P" ]; then
            echo "::notice::Not deployed: set CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and OWNER_PASSWORD on this repo."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # Create-or-find only. Nothing in this workflow deletes data.
      - name: Ensure R2 bucket and D1 database
        if: steps.check.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler r2 bucket info shuttle-videos >/dev/null 2>&1 || npx wrangler r2 bucket create shuttle-videos
          ID=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="shuttle") | .uuid')
          if [ -z "$ID" ]; then
            npx wrangler d1 create shuttle
            ID=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="shuttle") | .uuid')
          fi
          test -n "$ID"
          sed -i "s/^database_id = .*/database_id = \"$ID\"/" wrangler.toml
          npx wrangler d1 migrations apply shuttle --remote

      - name: Deploy Worker
        if: steps.check.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SHUTTLE_DOMAIN: ${{ secrets.SHUTTLE_DOMAIN }}
        run: |
          set -euo pipefail
          if [ -n "${SHUTTLE_DOMAIN:-}" ]; then
            D=$(printf '%s' "$SHUTTLE_DOMAIN" | tr 'A-Z' 'a-z' | tr -d '[:space:]')
            if ! printf '%s' "$D" | grep -Eq '^([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,63}$'; then
              echo "::error::SHUTTLE_DOMAIN must be a bare hostname like videos.example.com (no https://, path or port)"; exit 1
            fi
            # A top-level [[routes]] table has to sit before the [env.local] tables.
            python3 - "$D" <<'PY'
          import sys
          d = sys.argv[1]
          p = 'wrangler.toml'
          s = open(p).read()
          block = f'[[routes]]\npattern = "{d}"\ncustom_domain = true\n\n'
          assert '[env.local]' in s and '[[routes]]' not in s
          open(p, 'w').write(s.replace('[env.local]', block + '[env.local]', 1))
          PY
            echo "https://$D" > domain.txt
          fi
          npx wrangler deploy | tee deploy.log
          grep -Eo 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1 > url.txt || true

      - name: Worker secrets
        if: steps.check.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OWNER_PASSWORD: ${{ secrets.OWNER_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$OWNER_PASSWORD" | npx wrangler secret put OWNER_PASSWORD
          if ! npx wrangler secret list | grep -q '"SESSION_SECRET"'; then
            openssl rand -base64 48 | tr -d '\n' | npx wrangler secret put SESSION_SECRET
          fi

      - name: Verify
        if: steps.check.outputs.ready == 'true'
        run: |
          check() {  # $1 = base URL, $2 = tries (4 s apart)
            for _ in $(seq 1 "$2"); do
              if curl -fsS "$1/api/me" | grep -q '"passwordSet":true'; then echo "live at $1"; return 0; fi
              sleep 4
            done
            echo "::error::$1/api/me did not answer with passwordSet:true"; return 1
          }
          ok=0
          URL=$(cat url.txt 2>/dev/null || true)
          if [ -n "$URL" ]; then check "$URL" 30 || ok=1; else echo "No workers.dev URL in the deploy output"; fi
          # A new Custom Domain needs its DNS record and certificate first; allow ~5 minutes.
          if [ -s domain.txt ]; then check "$(cat domain.txt)" 75 || ok=1; fi
          exit $ok
