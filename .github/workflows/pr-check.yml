# Runs the tests on every pull request, so a PR shows pass/fail BEFORE it is merged. Merging to main
# deploys, and the deploy doesn't run the tests again. No secrets: pull_request from a fork gets
# none, and this job asks for none.
name: PR check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Generate the test fixture
        # The script bounds and retries the ffmpeg install itself; this is the backstop.
        timeout-minutes: 15
        run: |
          sh scripts/ci-ffmpeg.sh
          mkdir -p test/out
          ffmpeg -loglevel error -y -f lavfi -i testsrc2=size=1280x720:rate=30 -f lavfi -i sine=frequency=440 -t 20 \
            -c:v libx264 -b:v 3M -pix_fmt yuv420p -c:a aac -movflags frag_keyframe+empty_moov test/out/sample.mp4
      - name: API tests (wrangler dev, local R2 + D1)
        run: npm test
      # Everything here is a dev dependency (wrangler and what it pulls in), and it runs in the
      # deploy job next to the secrets, so the whole tree is audited, not just runtime packages.
      - name: npm audit (report only; the weekly review compares it to main)
        run: npm audit || true
